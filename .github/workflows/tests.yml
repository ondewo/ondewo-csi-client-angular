name: tests

on:
  push:
    branches:
      - master
      - 'OND211-**'
  pull_request:
    branches:
      - master

jobs:
  auth-unit-tests:
    name: Keycloak auth surface unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      # The library-layout guard reads ng-packagr's `dest` from the proto-compiler's own
      # ng-package.json and fails loudly, rather than passing, when it cannot resolve it.
      # Only that submodule is needed; .gitmodules uses an ssh URL, so rewrite it to https
      # because the repository is public and the runner has no deploy key.
      - name: Check out the proto-compiler submodule
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init ondewo-proto-compiler

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Run auth unit tests with coverage (100% gate on auth surface)
        run: npx jest --config jest.config.js --coverage --ci
